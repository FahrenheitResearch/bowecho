name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "review/**"
      - "release/**"

jobs:
  rust:
    name: Rust
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      # Twice during the v0.22-v0.27 sprint a non-UTF-8-safe edit pipeline
      # shipped mojibake into user-visible strings (guide, event explorer).
      # Fail fast if the classic UTF-8-as-cp1252 byte sequences reappear.
      - name: Mojibake guard
        shell: bash
        run: |
          if git grep -nI -e 'â€' -e 'Â·' -e 'Â°' -e 'Ã©' -- 'crates/**' 'docs/**' 'README.md'; then
            echo '::error::Mojibake byte sequences found - a file was edited with a non-UTF-8 tool.'
            exit 1
          fi

      - name: Test
        run: cargo test --workspace --all-targets

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
