name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "review/**"
      - "release/**"

jobs:
  rust:
    name: Rust
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      # Twice during the v0.22-v0.27 sprint a non-UTF-8-safe edit pipeline
      # shipped mojibake into user-visible strings (guide, event explorer).
      # Fail fast if the classic UTF-8-as-cp1252 byte sequences reappear.
      - name: Mojibake guard
        shell: bash
        run: |
          if git grep -nI -e 'â€' -e 'Â·' -e 'Â°' -e 'Ã©' -- 'crates/**' 'docs/**' 'README.md'; then
            echo '::error::Mojibake byte sequences found - a file was edited with a non-UTF-8 tool.'
            exit 1
          fi

      - name: Release executable size guard tests
        shell: bash
        run: bash tools/check_release_binary_size_test.sh

      - name: Release tag prerelease classification tests
        shell: bash
        run: bash tools/release_tag_prerelease_test.sh

      - name: macOS plist version tests
        run: python3 tools/macos_plist_versions_test.py

      - name: Test
        run: cargo test --workspace --all-targets

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  # B5 (docs/miniderecho-spec.md §1): the iOS tripwire. Cross-checking
  # aarch64-apple-ios from Windows/Linux hosts fails at the bzip2-sys/ring
  # build scripts (they need an Apple SDK), so this leg runs on a macOS
  # runner — long before any physical Mac session (spec §2 iOS boundary).
  ios-tripwire:
    name: iOS tripwire (mini_ui)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add the iOS target
        run: rustup target add aarch64-apple-ios

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Check mini_ui for aarch64-apple-ios
        run: cargo check -p mini_ui --target aarch64-apple-ios
