name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  BIN_NAME: bowecho

jobs:
  create-release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Validate release tag matches workspace version
        shell: bash
        run: |
          set -euo pipefail
          workspace_version="$(python3 -c '
          import pathlib
          import tomllib

          manifest = tomllib.loads(pathlib.Path("Cargo.toml").read_text(encoding="utf-8"))
          print(manifest["workspace"]["package"]["version"])
          ')"
          expected_tag="v${workspace_version}"
          if [[ "${GITHUB_REF_NAME}" != "${expected_tag}" ]]; then
            echo "::error title=Release tag/version mismatch::Tag ${GITHUB_REF_NAME} does not match Cargo workspace version ${workspace_version} (expected ${expected_tag})."
            exit 1
          fi

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes_file="docs/releases/${GITHUB_REF_NAME}.md"
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists."
            if [ -f "$notes_file" ]; then
              gh release edit "${GITHUB_REF_NAME}" \
                --repo "${GITHUB_REPOSITORY}" \
                --notes-file "$notes_file"
            fi
          else
            release_args=(
              "${GITHUB_REF_NAME}"
              --repo "${GITHUB_REPOSITORY}"
              --title "BowEcho ${GITHUB_REF_NAME}"
              --draft
            )
            if [ -f "$notes_file" ]; then
              release_args+=(--notes-file "$notes_file")
            else
              release_args+=(--generate-notes)
            fi
            gh release create "${release_args[@]}"
          fi

  build:
    needs: create-release
    if: ${{ always() && (needs.create-release.result == 'success' || needs.create-release.result == 'skipped') }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # update_asset bakes the exact release-asset name into the binary
          # (BOWECHO_UPDATE_ASSET) so the in-app updater can only download
          # the variant it is already running. Windows and macOS matrix
          # builds receive it; Linux and local builds without it keep the
          # browser-based update flow.
          - os: windows-latest
            artifact_name: bowecho-windows-x64
            package: windows
            rustflags: "-C target-feature=+crt-static"
            update_asset: bowecho-windows-x64.exe
          # AVX2 variant for ~2015+ CPUs: benched -21% on the dealiased
          # velocity raster and -30% on reflectivity vs baseline x86-64
          # (KTLX 2013-05-20 Moore volume, pixel-identical output).
          - os: windows-latest
            artifact_name: bowecho-windows-x64-v3
            package: windows
            rustflags: "-C target-feature=+crt-static -C target-cpu=x86-64-v3"
            update_asset: bowecho-windows-x64-v3.exe
          - os: windows-11-arm
            artifact_name: bowecho-windows-arm64
            package: windows
            rustflags: "-C target-feature=+crt-static"
            update_asset: bowecho-windows-arm64.exe
          - os: ubuntu-24.04
            artifact_name: bowecho-linux-x64
            package: linux
          - os: ubuntu-24.04-arm
            artifact_name: bowecho-linux-arm64
            package: linux
          - os: macos-15-intel
            artifact_name: bowecho-macos-intel
            package: macos
            update_asset: bowecho-macos-intel.zip
          - os: macos-15
            artifact_name: bowecho-macos-apple-silicon
            package: macos
            update_asset: bowecho-macos-apple-silicon.zip
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::Retries=5 install -y --no-install-recommends \
            pkg-config \
            libgtk-3-dev \
            libgl1-mesa-dev \
            libx11-dev \
            libxi-dev \
            libxkbcommon-dev

      - name: Use stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      # Fat LTO links the whole app in one LLVM pass; the hosted Windows
      # runner's default commit limit is what OOM'd the v0.27.1 build and
      # forced the thin-LTO downgrade. A larger pagefile lets the linker
      # spill instead of dying, so shipped binaries keep full optimization.
      - name: Expand Windows pagefile for fat-LTO link
        if: runner.os == 'Windows'
        uses: al-cheb/configure-pagefile-action@a3b6ebd6b634da88790d9c58d4b37a7f4a7b8708 # v1.4
        with:
          minimum-size: 16GB
          maximum-size: 32GB
          disk-root: "C:"

      - name: Build release binary
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
          # In-app updater self-identification (empty for Linux matrix
          # entries, which the code treats as "cannot self-update").
          BOWECHO_UPDATE_ASSET: ${{ matrix.update_asset }}
        run: cargo build --release -p app_ui --bin bowecho

      - name: Detect Windows signing secrets
        id: windows_signing
        if: runner.os == 'Windows'
        shell: bash
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TS_ENDPOINT: ${{ secrets.AZURE_TS_ENDPOINT }}
          AZURE_TS_ACCOUNT: ${{ secrets.AZURE_TS_ACCOUNT }}
          AZURE_TS_PROFILE: ${{ secrets.AZURE_TS_PROFILE }}
        run: |
          set -euo pipefail
          if [[ -n "$AZURE_TENANT_ID" \
            && -n "$AZURE_CLIENT_ID" \
            && -n "$AZURE_CLIENT_SECRET" \
            && -n "$AZURE_TS_ENDPOINT" \
            && -n "$AZURE_TS_ACCOUNT" \
            && -n "$AZURE_TS_PROFILE" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            if [[ "${GITHUB_REF:-}" == refs/tags/* ]]; then
              echo "::error title=Windows signing unavailable::Tagged Windows releases require every Azure Trusted Signing secret (see docs/SIGNING.md)."
              exit 1
            fi
          fi

      # Signs bowecho.exe via Azure Trusted Signing when the secrets exist.
      # Manual RC builds may remain unsigned, but tagged releases fail above
      # rather than publishing binaries that the in-app updater would reject.
      - name: Sign Windows binary (Azure Trusted Signing)
        if: runner.os == 'Windows' && steps.windows_signing.outputs.enabled == 'true'
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        uses: azure/trusted-signing-action@1d365fec12862c4aa68fcac418143d73f0cea293 # v0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_TS_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_TS_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_TS_PROFILE }}
          files-folder: target/release
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          # Never cache the signing tooling: GitHub's 10 GB cache limit evicts
          # the small SignCli entry while its siblings survive, and the action
          # then skips the install and fails with "Invoke-TrustedSigning is
          # not recognized" (hit v0.30.4 and v0.30.5; upstream issue). A fresh
          # install costs ~1 minute per release build and cannot be poisoned.
          cache-dependencies: false

      - name: Check Windows release executable size
        if: runner.os == 'Windows'
        shell: bash
        run: bash tools/check_release_binary_size.sh target/release/bowecho.exe

      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target\release\bowecho.exe "dist\${{ matrix.artifact_name }}.exe"
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item target\release\bowecho.exe package\bowecho.exe
          Copy-Item README.md package\README.md
          Copy-Item LICENSE-MIT package\LICENSE-MIT
          Copy-Item LICENSE-APACHE package\LICENSE-APACHE
          Copy-Item THIRD-PARTY-NOTICES.md package\THIRD-PARTY-NOTICES.md
          Copy-Item PYART-LICENSE.txt package\PYART-LICENSE.txt
          Compress-Archive -Path package\* -DestinationPath "dist\${{ matrix.artifact_name }}.zip" -Force

      # The raw .exe name is an updater protocol contract. The matching ZIP is
      # the canonical manual download and its embedded executable must be the
      # same signed bytes; it also acts as the notice sidecar for that updater
      # asset instead of changing the baked BOWECHO_UPDATE_ASSET name.
      - name: Verify Windows package contents
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $expected = @(
            "bowecho.exe",
            "README.md",
            "LICENSE-MIT",
            "LICENSE-APACHE",
            "THIRD-PARTY-NOTICES.md",
            "PYART-LICENSE.txt"
          ) | Sort-Object
          $check = Join-Path $env:RUNNER_TEMP "bowecho-package-check"
          New-Item -ItemType Directory -Force $check | Out-Null
          Expand-Archive "dist\${{ matrix.artifact_name }}.zip" -DestinationPath $check -Force
          $directories = @(Get-ChildItem $check -Recurse -Directory)
          if ($directories.Count -ne 0) {
            throw "Windows package contains an unexpected nested directory"
          }
          $actual = Get-ChildItem $check -Recurse -File | ForEach-Object {
            $_.FullName.Substring($check.Length).TrimStart(
              [IO.Path]::DirectorySeparatorChar,
              [IO.Path]::AltDirectorySeparatorChar
            ).Replace('\', '/')
          } | Sort-Object
          $difference = Compare-Object -ReferenceObject $expected -DifferenceObject $actual
          if ($difference) {
            $difference | Format-Table | Out-String | Write-Error
            throw "Windows package contents differ from the exact release contract"
          }
          if ((Get-FileHash "dist\${{ matrix.artifact_name }}.exe" -Algorithm SHA256).Hash -ne
              (Get-FileHash (Join-Path $check "bowecho.exe") -Algorithm SHA256).Hash) {
            throw "The Windows updater executable differs from the notice-bearing package executable"
          }
          foreach ($notice in @("README.md", "LICENSE-MIT", "LICENSE-APACHE", "THIRD-PARTY-NOTICES.md", "PYART-LICENSE.txt")) {
            if ((Get-FileHash $notice -Algorithm SHA256).Hash -ne
                (Get-FileHash (Join-Path $check $notice) -Algorithm SHA256).Hash) {
              throw "Packaged $notice differs from the repository copy"
            }
          }

      - name: Package macOS app
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          app="BowEcho.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp "target/release/${BIN_NAME}" "$app/Contents/MacOS/${BIN_NAME}"
          cp README.md "$app/Contents/Resources/README.md"
          cp LICENSE-MIT "$app/Contents/Resources/LICENSE-MIT"
          cp LICENSE-APACHE "$app/Contents/Resources/LICENSE-APACHE"
          cp THIRD-PARTY-NOTICES.md "$app/Contents/Resources/THIRD-PARTY-NOTICES.md"
          cp PYART-LICENSE.txt "$app/Contents/Resources/PYART-LICENSE.txt"
          chmod +x "$app/Contents/MacOS/${BIN_NAME}"
          if [[ "${GITHUB_REF_NAME:-}" =~ ^v[0-9] ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(awk -F '"' '/^version =/ { print $2; exit }' Cargo.toml)"
          fi
          cat > "$app/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDevelopmentRegion</key>
            <string>en</string>
            <key>CFBundleDisplayName</key>
            <string>BowEcho</string>
            <key>CFBundleExecutable</key>
            <string>bowecho</string>
            <key>CFBundleIdentifier</key>
            <string>research.fahrenheit.bowecho</string>
            <key>CFBundleInfoDictionaryVersion</key>
            <string>6.0</string>
            <key>CFBundleName</key>
            <string>BowEcho</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>${version}</string>
            <key>CFBundleVersion</key>
            <string>${version}</string>
            <key>LSMinimumSystemVersion</key>
            <string>12.0</string>
            <key>NSHighResolutionCapable</key>
            <true/>
          </dict>
          </plist>
          PLIST

      - name: Detect macOS signing secrets
        id: macos_signing
        if: runner.os == 'macOS'
        shell: bash
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          if [[ -n "$MACOS_CERTIFICATE_BASE64" \
            && -n "$MACOS_CERTIFICATE_PWD" \
            && -n "$ASC_API_KEY_BASE64" \
            && -n "$ASC_KEY_ID" \
            && -n "$ASC_ISSUER_ID" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            if [[ "${GITHUB_REF:-}" == refs/tags/* ]]; then
              echo "::error::Tagged macOS releases require every Developer ID and notarization secret (see docs/SIGNING.md)."
              exit 1
            fi
          fi

      # Signs + notarizes BowEcho.app with the repo's Developer ID
      # certificate and App Store Connect API key (docs/SIGNING.md). Tagged
      # release jobs cannot reach this point without every required secret.
      - name: Sign and notarize macOS app
        if: runner.os == 'macOS' && steps.macos_signing.outputs.enabled == 'true'
        shell: bash
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          app="BowEcho.app"
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -base64 24)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 1800 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          echo "$MACOS_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" \
            -P "$MACOS_CERTIFICATE_PWD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db
          identity="$(security find-identity -v -p codesigning "$keychain" \
            | awk -F '"' '/Developer ID Application/ {print $2; exit}')"
          if [ -z "$identity" ]; then
            echo "No Developer ID Application identity found in certificate" >&2
            exit 1
          fi
          echo "Signing with: $identity"
          codesign --force --deep --options runtime --timestamp \
            --sign "$identity" "$app"
          codesign --verify --deep --strict "$app"
          echo "$ASC_API_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          ditto -c -k --sequesterRsrc --keepParent "$app" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$ASC_KEY_ID" \
            --issuer "$ASC_ISSUER_ID" --wait
          xcrun stapler staple "$app"
          security delete-keychain "$keychain"

      - name: Validate signed macOS app
        if: runner.os == 'macOS' && steps.macos_signing.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          app="BowEcho.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=4 "$app"

      - name: Check macOS release executable size
        if: runner.os == 'macOS'
        shell: bash
        run: bash tools/check_release_binary_size.sh BowEcho.app/Contents/MacOS/bowecho

      - name: Zip macOS app
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          ditto -c -k --sequesterRsrc --keepParent "BowEcho.app" "dist/${{ matrix.artifact_name }}.zip"

      - name: Verify macOS package contents
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          archive="dist/${{ matrix.artifact_name }}.zip"
          entries="$(unzip -Z1 "$archive")"
          required=(
            "BowEcho.app/Contents/MacOS/bowecho"
            "BowEcho.app/Contents/Resources/README.md"
            "BowEcho.app/Contents/Resources/LICENSE-MIT"
            "BowEcho.app/Contents/Resources/LICENSE-APACHE"
            "BowEcho.app/Contents/Resources/THIRD-PARTY-NOTICES.md"
            "BowEcho.app/Contents/Resources/PYART-LICENSE.txt"
          )
          for path in "${required[@]}"; do
            count="$(printf '%s\n' "$entries" \
              | awk -v expected="$path" '$0 == expected { count++ } END { print count + 0 }')"
            if [[ "$count" -ne 1 ]]; then
              echo "::error::macOS package is missing exactly one ${path} entry"
              exit 1
            fi
          done
          unzip -p "$archive" "BowEcho.app/Contents/MacOS/bowecho" \
            | cmp - "BowEcho.app/Contents/MacOS/bowecho"
          for notice in README.md LICENSE-MIT LICENSE-APACHE THIRD-PARTY-NOTICES.md PYART-LICENSE.txt; do
            unzip -p "$archive" "BowEcho.app/Contents/Resources/${notice}" \
              | cmp - "$notice"
          done

      - name: Check Linux release executable size
        if: runner.os == 'Linux'
        shell: bash
        run: bash tools/check_release_binary_size.sh target/release/bowecho

      - name: Package Linux binary
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          bundle="${{ matrix.artifact_name }}"
          mkdir -p "dist/${bundle}"
          cp "target/release/${BIN_NAME}" "dist/${bundle}/bowecho"
          cp README.md LICENSE-MIT LICENSE-APACHE THIRD-PARTY-NOTICES.md PYART-LICENSE.txt "dist/${bundle}/"
          chmod +x "dist/${bundle}/bowecho"
          tar --sort=name \
            --mtime='UTC 1970-01-01' \
            --owner=0 --group=0 --numeric-owner \
            -czf "dist/${bundle}.tar.gz" -C dist "${bundle}"
          rm -rf -- "dist/${bundle}"

      - name: Verify Linux package contents
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          bundle="${{ matrix.artifact_name }}"
          archive="dist/${bundle}.tar.gz"
          check_dir="${RUNNER_TEMP}/bowecho-package-check"
          expected="${RUNNER_TEMP}/bowecho-package-expected.txt"
          actual="${RUNNER_TEMP}/bowecho-package-actual.txt"
          mkdir -p "$check_dir"
          printf '%s\n' \
            "${bundle}/" \
            "${bundle}/LICENSE-APACHE" \
            "${bundle}/LICENSE-MIT" \
            "${bundle}/PYART-LICENSE.txt" \
            "${bundle}/README.md" \
            "${bundle}/THIRD-PARTY-NOTICES.md" \
            "${bundle}/bowecho" \
            | LC_ALL=C sort > "$expected"
          tar -tzf "$archive" | LC_ALL=C sort > "$actual"
          diff -u "$expected" "$actual"
          tar -xzf "$archive" -C "$check_dir"
          cmp "target/release/${BIN_NAME}" "$check_dir/${bundle}/bowecho"
          for notice in README.md LICENSE-MIT LICENSE-APACHE THIRD-PARTY-NOTICES.md PYART-LICENSE.txt; do
            cmp "$notice" "$check_dir/${bundle}/${notice}"
          done

      # v0.34.1 carries the optional research data once, on the Linux x64
      # matrix leg. It is deliberately a separate release asset rather than
      # part of any executable, and later releases must not silently duplicate
      # this immutable pack.
      - name: Package v0.34.1 property T-matrix research data
        if: runner.os == 'Linux' && matrix.artifact_name == 'bowecho-linux-x64' && github.ref == 'refs/tags/v0.34.1'
        shell: bash
        env:
          PACK_NAME: bowecho-property-tmatrix-sband-pytmatrix-0.3.3-research-v1.zip
          EXPECTED_PACK_BYTES: "191400602"
          EXPECTED_PACK_SHA256: 80b3a2c65ead59c0a951d491e966694e80bb0c49eeb1d3b1fc532bcadbcf507e
        run: |
          set -euo pipefail
          pack_path="target/research-packs/${PACK_NAME}"
          python3 tools/package_legacy_property_tmatrix.py --output "$pack_path"

          actual_bytes="$(wc -c < "$pack_path")"
          actual_bytes="${actual_bytes//[[:space:]]/}"
          actual_sha256="$(sha256sum "$pack_path" | awk '{print $1}')"
          if [[ "$actual_bytes" != "$EXPECTED_PACK_BYTES" ]]; then
            echo "::error title=Property T-matrix pack size mismatch::Expected ${EXPECTED_PACK_BYTES} bytes, got ${actual_bytes} bytes for ${PACK_NAME}."
            exit 1
          fi
          if [[ "$actual_sha256" != "$EXPECTED_PACK_SHA256" ]]; then
            echo "::error title=Property T-matrix pack checksum mismatch::Expected SHA-256 ${EXPECTED_PACK_SHA256}, got ${actual_sha256} for ${PACK_NAME}."
            exit 1
          fi

          cp "$pack_path" "dist/${PACK_NAME}"

      - name: Generate SHA-256 checksums
        shell: bash
        # Published beside every asset so users can verify a download is the
        # CI-built binary (antivirus ML heuristics flag unsigned Rust exes;
        # a hash check against the release page settles provenance).
        run: |
          set -euo pipefail
          cd dist
          for f in *; do
            sha256sum "$f" > "$f.sha256"
          done

      - name: Verify SHA-256 checksum set
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          shopt -s nullglob
          assets=()
          for path in *; do
            if [[ -f "$path" && "$path" != *.sha256 ]]; then
              assets+=("$path")
            fi
          done
          if [[ "${#assets[@]}" -eq 0 ]]; then
            echo "::error::No release assets exist to verify"
            exit 1
          fi
          for asset in "${assets[@]}"; do
            checksum="${asset}.sha256"
            if [[ ! -f "$checksum" ]]; then
              echo "::error::Missing checksum for ${asset}"
              exit 1
            fi
            expected="$(sha256sum "$asset")"
            actual="$(cat "$checksum")"
            if [[ "$actual" != "$expected" ]]; then
              echo "::error::Checksum file for ${asset} is malformed or stale"
              exit 1
            fi
          done
          for checksum in *.sha256; do
            if [[ ! -f "${checksum%.sha256}" ]]; then
              echo "::error::Orphan checksum ${checksum}"
              exit 1
            fi
          done

      - name: Upload workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/*
          if-no-files-found: error

  upload-release-assets:
    needs: build
    if: startsWith(github.ref, 'refs/tags/') && needs.build.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download verified build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true

      - name: Verify aggregated release assets
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(dist/*)
          if [[ "${#assets[@]}" -eq 0 ]]; then
            echo "::error::No release assets were downloaded"
            exit 1
          fi
          for asset in "${assets[@]}"; do
            if [[ ! -f "$asset" ]]; then
              echo "::error::Unexpected directory in aggregated release assets: $asset"
              exit 1
            fi
          done

      - name: Upload release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" dist/* --clobber --repo "${GITHUB_REPOSITORY}"

  publish-release:
    needs: upload-release-assets
    if: startsWith(github.ref, 'refs/tags/') && needs.upload-release-assets.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Publish release after all assets upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${GITHUB_REF_NAME}" --draft=false --repo "${GITHUB_REPOSITORY}"
