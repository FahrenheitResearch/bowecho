[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.27.3"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/FahrenheitResearch/bowecho"

[workspace.dependencies]
byteorder = "1.5"
bzip2 = { version = "0.6", default-features = false, features = ["bzip2-sys"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
eframe = { version = "0.34.3", features = ["glow"] }
earcutr = "0.5"
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff"] }
rfd = { version = "0.15", default-features = false, features = ["common-controls-v6"] }
libdeflate-sys = "1.25.2"
quick-xml = { version = "0.39", features = ["serialize"] }
rayon = "1.11"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tiff = "0.11.3"
zip = { version = "8.6", default-features = false, features = ["deflate"] }

[profile.release]
lto = "thin"
codegen-units = 16
strip = true
# panic = "abort" is intentionally NOT set: app_ui isolates worker panics
# with catch_unwind / thread joins, and abort would turn those contained
# failures into full app crashes.
# Thin LTO avoids rustc/LLVM out-of-memory failures on the large Windows app
# link while keeping optimized release builds reproducible in CI.

[profile.release-fast]
inherits = "release"
lto = "thin"
codegen-units = 16
incremental = true
strip = false

[patch.crates-io]
hdf5-reader = { git = "https://github.com/FahrenheitResearch/rusty-weather", rev = "30bf2702655f82929cc22832c48fa1284d28dbea" }
