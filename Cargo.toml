[workspace]
members = [
    "crates/app_ui",
    "crates/bench",
    "crates/bowecho_cli",
    "crates/cache",
    "crates/color_tables",
    "crates/data_source",
    "crates/mini_ui",
    "crates/nexrad_io",
    "crates/product_engine",
    "crates/radar_core",
    "crates/radar_scattering",
    "crates/render2d",
    "crates/settings",
    "crates/simradar_cuda",
    "crates/simradar_validation",
    "crates/styles",
    "crates/ui_core",
]
resolver = "3"

[workspace.package]
version = "0.34.13"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/FahrenheitResearch/bowecho"

[workspace.dependencies]
byteorder = "1.5"
bzip2 = { version = "0.6", default-features = false, features = ["bzip2-sys"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
color_tables = { path = "crates/color_tables" }
eframe = { version = "0.34.3", features = ["glow"] }
egui_tiles = "0.15"
earcutr = "0.5"
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff"] }
rfd = { version = "0.15", default-features = false, features = ["common-controls-v6", "gtk3"] }
libdeflate-sys = "1.25.2"
quick-xml = { version = "0.39", features = ["serialize"] }
rayon = "1.11"
region-global-dealias = { git = "https://github.com/FahrenheitResearch/region-global-dealias", rev = "a7d4baf6b8a11ca5602fe44a533efd8200ef6cea" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
tiff = "0.11.3"
toml = "0.9"
ui_core = { path = "crates/ui_core" }
wrf-core = { git = "https://github.com/FahrenheitResearch/wrf-rust.git", rev = "9874474d9566a7536a90f457a48be30caa5f973a", package = "wrf-core", default-features = false, features = ["pure-rust-reader"] }
zip = { version = "8.6", default-features = false, features = ["deflate"] }

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
# panic = "abort" is intentionally NOT set: app_ui isolates worker panics
# with catch_unwind / thread joins, and abort would turn those contained
# failures into full app crashes.
# Fat LTO / 1 CGU is the shipping profile: ~17% smaller binary and best
# hot-loop codegen. The v0.27.1 thin-LTO downgrade worked around an
# LLVM link OOM on the CI Windows runner; the release workflow now bumps
# the runner pagefile instead so shipped binaries keep full optimization.

# Local iteration profile only (never ships): thin LTO + incremental
# brings the exe rebuild from ~10 min down to ~2 min on this codebase.
[profile.release-fast]
inherits = "release"
lto = "thin"
codegen-units = 16
incremental = true
strip = false

[patch.crates-io]
hdf5-reader = { git = "https://github.com/FahrenheitResearch/rusty-weather", rev = "cf0ca3693650153ff0f79a0e60c3ec2da7d0af01" }
openjp2 = { git = "https://github.com/FahrenheitResearch/rusty-weather", rev = "cf0ca3693650153ff0f79a0e60c3ec2da7d0af01" }

# sharppyrs pulls sharprs from its standalone repo; unify it with the
# rusty-weather-vendored sharprs every other crate here uses so the two
# resolve to ONE crate (identical types).
[patch."https://github.com/FahrenheitResearch/sharprs"]
sharprs = { git = "https://github.com/FahrenheitResearch/rusty-weather", rev = "cf0ca3693650153ff0f79a0e60c3ec2da7d0af01" }
