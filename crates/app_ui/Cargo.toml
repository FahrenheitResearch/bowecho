# WRF/NetCDF local ingest (rusty-weather v0.2.3 Feature 2 — WRF/GUI soundings).
# `netcrust` is the pure-Rust NetCDF/HDF5 reader; it is already pulled
# transitively (rw-glm, rw-sat) and its `hdf5-reader` is pinned by the
# workspace-root `[patch.crates-io]`. `wrf-core` computes WRF diagnostics and
# destaggered 3D fields for the isobaric sounding volumes. Both feed
# `rw_store::write_hour_from_fields_with_derived`, so imported WRF runs sound
# through the existing ModelDataDock skew-T path.
[dependencies.netcrust]
git = "https://github.com/FahrenheitResearch/rusty-weather"
rev = "9753f554930e682e50d715aea63d1a76b224ea27"

# GRIB Edition 1 decode (ERA-20C / GDEX "past" reanalysis local import —
# see `grib_import.rs`). Same pinned rusty-weather rev as everything above;
# default features off: they only gate GRIB2 codecs (openjp2/png) this
# importer never touches.
[dependencies.grib-core]
git = "https://github.com/FahrenheitResearch/rusty-weather"
rev = "9753f554930e682e50d715aea63d1a76b224ea27"
default-features = false

[dependencies.wrf-core]
git = "https://github.com/FahrenheitResearch/wrf-rust.git"
rev = "2550d4e2f85c61a190cf639d59e713f553facd07"
package = "wrf-core"

# Formula Lab source-readiness must use the exact same unit parser as the
# pinned evaluator; a hand-maintained unit list can incorrectly claim Ready.
[dependencies.wrf-formula]
git = "https://github.com/FahrenheitResearch/wrf-rust.git"
rev = "2550d4e2f85c61a190cf639d59e713f553facd07"
package = "wrf-formula"
