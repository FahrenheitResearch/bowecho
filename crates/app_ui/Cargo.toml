[package]
name = "app_ui"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[dependencies]
chrono.workspace = true
rayon.workspace = true
color_tables = { path = "../color_tables" }
data_source = { path = "../data_source" }
flate2.workspace = true
eframe.workspace = true
# Dockable workspace tile tree (docs/docking-spike.md: egui_tiles 0.15.0
# verified compatible with egui 0.34; rerun-io maintained, serde layouts).
egui_tiles = { version = "0.15", features = ["serde"] }
earcutr.workspace = true
image = { workspace = true, features = ["gif"] }
nexrad_io = { path = "../nexrad_io" }
product_engine = { path = "../product_engine" }
radar_core = { path = "../radar_core" }
radar_scattering = { path = "../radar_scattering" }
render2d = { path = "../render2d" }
settings = { path = "../settings" }
simradar_cuda = { path = "../simradar_cuda" }
styles = { path = "../styles" }
ui_core = { path = "../ui_core" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
quick-xml.workspace = true
# SimSat v0.2.1 engine plus MTG-I1 camera integration, pinned exactly.
simsat = { git = "https://github.com/FahrenheitResearch/simsat.git", rev = "fd2b8f48e904342bc81bd003503ad0f4e27c5596" }
# In-app updater (Settings > security): streaming release-asset download with
# progress, hashing the streamed bytes for the SHA-256 gate that runs before
# the Authenticode gate (docs/SIGNING.md).
reqwest.workspace = true
sha2 = "0.10"
tiff.workspace = true

[dev-dependencies]
# B3 (docs/miniderecho-spec.md §1): the shared slots' `inject_for_test`
# stays visible to this crate's tests after the ui_core extraction.
ui_core = { path = "../ui_core", features = ["test-util"] }
# Headless WGSL validation for the vol3d raymarch shader: the build nodes have
# no GPU, so wgpu never creates the pipeline. naga (already in the tree via
# wgpu 29.0.3) parses + validates the shader string in a unit test instead.
naga = { version = "29.0.3", features = ["wgsl-in"] }

[[bin]]
name = "bowecho"
path = "src/main.rs"

[build-dependencies]
winresource = "0.1"

[target.'cfg(any(windows, target_os = "macos", target_os = "linux"))'.dependencies]
rfd.workspace = true

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Use the desktop Secret Service without requiring distro libdbus-dev headers
# on release builders or user systems.
keyring = { version = "=3.6.3", default-features = false, features = ["sync-secret-service", "vendored"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["windows-native"] }
# In-app updater signature gate: WinVerifyTrust (Authenticode) on the
# downloaded release binary before it replaces the running executable.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    # WINTRUST_DATA itself is additionally gated behind Cryptography.
    "Win32_Security_Cryptography",
    "Win32_Security_WinTrust",
    # SetThreadPriority: WRF import workers run below normal so a
    # 20-minute large-grid import can't starve the desktop.
    "Win32_System_Threading",
] }

# Model-data dock and satellite/model stack (rusty-weather).
[dependencies.rw-ui]
git = "https://github.com/FahrenheitResearch/rusty-weather"
rev = "9753f554930e682e50d715aea63d1a76b224ea27"

