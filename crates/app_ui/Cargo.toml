[dependencies.rustwx-sounding]
git = "https://github.com/FahrenheitResearch/rusty-weather"
rev = "9753f554930e682e50d715aea63d1a76b224ea27"

[dependencies.sharprs]
git = "https://github.com/FahrenheitResearch/rusty-weather"
rev = "9753f554930e682e50d715aea63d1a76b224ea27"

[dependencies.rw-ingest]
git = "https://github.com/FahrenheitResearch/rusty-weather"
rev = "9753f554930e682e50d715aea63d1a76b224ea27"

[dependencies.rw-glm]
git = "https://github.com/FahrenheitResearch/rusty-weather"
rev = "9753f554930e682e50d715aea63d1a76b224ea27"

[dependencies.rustwx-products]
git = "https://github.com/FahrenheitResearch/rusty-weather"
rev = "9753f554930e682e50d715aea63d1a76b224ea27"

[dependencies.rustwx-core]
git = "https://github.com/FahrenheitResearch/rusty-weather"
