[package]
name = "app_ui"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[dependencies]
chrono.workspace = true
rayon.workspace = true
color_tables = { path = "../color_tables" }
data_source = { path = "../data_source" }
flate2.workspace = true
eframe.workspace = true
# Dockable workspace tile tree (docs/docking-spike.md: egui_tiles 0.15.0
# verified compatible with egui 0.34; rerun-io maintained, serde layouts).
egui_tiles = { version = "0.15", features = ["serde"] }
earcutr.workspace = true
image = { workspace = true, features = ["gif"] }
nexrad_io = { path = "../nexrad_io" }
product_engine = { path = "../product_engine" }
radar_core = { path = "../radar_core" }
render2d = { path = "../render2d" }
settings = { path = "../settings" }
styles = { path = "../styles" }
ui_core = { path = "../ui_core" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
quick-xml.workspace = true
# In-app updater (Settings > security): streaming release-asset download with
# progress, hashing the streamed bytes for the SHA-256 gate that runs before
# the Authenticode gate (docs/SIGNING.md).
reqwest.workspace = true
sha2 = "0.10"
tiff.workspace = true

[dev-dependencies]
# B3 (docs/miniderecho-spec.md §1): the shared slots' `inject_for_test`
# stays visible to this crate's tests after the ui_core extraction.
ui_core = { path = "../ui_core", features = ["test-util"] }

[[bin]]
name = "bowecho"
path = "src/main.rs"

[build-dependencies]
winresource = "0.1"

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
rfd.workspace = true

[target.'cfg(windows)'.dependencies]
# In-app updater signature gate: WinVerifyTrust (Authenticode) on the
# downloaded release binary before it replaces the running executable.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    # WINTRUST_DATA itself is additionally gated behind Cryptography.
    "Win32_Security_Cryptography",
    "Win32_Security_WinTrust",
] }

# Model-data dock and satellite/model stack (rusty-weather).
[dependencies.rw-ui]
git = "https://github.com/FahrenheitResearch/rusty-weather"
rev = "edb9d277cce7fe1cfa1080d159053c583ca07b6a"

[dependencies.rustwx-render]
git = "https://github.com/FahrenheitResearch/rusty-weather"
rev = "edb9d277cce7fe1cfa1080d159053c583ca07b6a"

[dependencies.rustwx-sounding]
git = "https://github.com/FahrenheitResearch/rusty-weather"
rev = "edb9d277cce7fe1cfa1080d159053c583ca07b6a"

[dependencies.sharprs]
git = "https://github.com/FahrenheitResearch/rusty-weather"
rev = "edb9d277cce7fe1cfa1080d159053c583ca07b6a"

[dependencies.rw-ingest]
git = "https://github.com/FahrenheitResearch/rusty-weather"
rev = "edb9d277cce7fe1cfa1080d159053c583ca07b6a"

[dependencies.rw-glm]
git = "https://github.com/FahrenheitResearch/rusty-weather"
rev = "edb9d277cce7fe1cfa1080d159053c583ca07b6a"

[dependencies.rustwx-products]
git = "https://github.com/FahrenheitResearch/rusty-weather"
rev = "edb9d277cce7fe1cfa1080d159053c583ca07b6a"

[dependencies.rustwx-core]
git = "https://github.com/FahrenheitResearch/rusty-weather"
