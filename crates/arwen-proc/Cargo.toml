[package]
name = "arwen-proc"
version = "0.1.0"
edition.workspace = true
license = "Apache-2.0"
description = "Sealed-environment process supervision + GPU lock for gpuwm subprocesses (adopted from rusty-weather rw-sim, Apache-2.0)."

[dependencies]
arwen-plan.workspace = true
chrono.workspace = true
fs4.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Com",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_UI_Shell",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
