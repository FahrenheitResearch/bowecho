[package]
name = "brslut-emitter"
version = "1.0.0"
edition = "2024"
publish = false

[dependencies]
radar_scattering = { path = "../../.." }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Keep this audit utility out of the application workspace and give it a
# compact, independently locked dependency graph.
[workspace]
resolver = "3"
