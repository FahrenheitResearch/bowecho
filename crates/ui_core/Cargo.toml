[package]
name = "ui_core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
chrono.workspace = true
data_source = { path = "../data_source" }
image.workspace = true
radar_core = { path = "../radar_core" }
settings = { path = "../settings" }

[target.'cfg(not(target_os = "ios"))'.dependencies]
eframe.workspace = true

[target.'cfg(target_os = "ios")'.dependencies]
eframe = { version = "0.34.3", default-features = false }

[features]
# B3 (docs/miniderecho-spec.md §1): expose `inject_for_test` to dependents'
# test builds. Dependents add `ui_core = { path = "../ui_core", features =
# ["test-util"] }` under [dev-dependencies].
test-util = []
