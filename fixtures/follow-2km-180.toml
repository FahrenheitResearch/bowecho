# STORM-FOLLOWING MOVING NEST demo, arm A (the moving nest).
# 2011-04-27 outbreak, 06Z-18Z: d01 6 km over MS/AL/TN, d02 a SMALL
# 150x150 @ 2 km child that FOLLOWS the warm-sector convection northeast
# (50+ kt storm motions) under [relocation.follow] -- UP_HELI_MAX
# centroid primary, composite-reflectivity handoff before rotation.
# Compare against arm B (moving_nest_20110427_static_2km.toml): the SAME
# storms covered statically need a 282x216 nest, 2.7x the nest cells --
# the moving nest buys equal coverage at a fraction of the VRAM.
#
# Geometry/physics inherited from the proven tdnest 6-2 km ladder for this
# case (same projection, same d01, same profile); ERA5 forcing 2011-04-26/27
# six-hourly is already fetched (see tools/moving_nest_demo_20110427.ps1,
# which stages ${GPUWM_DEMO_20110427_ROOT}).
#
# The [relocation] block is the leg-1 mechanism surface; [relocation.follow]
# is the tracker (gpuwm.core.storm_tracking).  The relocation RUNNER that
# evaluates the tracker each cycle boundary lands on lane/moving-nest-leg2;
# until it merges, this config validates end-to-end and integrates as a
# static nest (relocation is fingerprint-inert by design).
#
# restart_interval_s stays 0: a restart across a move promises nothing
# so the moving arm does not checkpoint.

[experiment]
name = "moving_nest_20110427_follow_2km"
start_time = 2011-04-27T06:00:00
run_seconds = 43200.0
feedback = 0
smooth_option = 0
blend_width = 5
spec_bdy_width = 5
restart_interval_s = 0.0

[projection]
map_proj = "lambert"
ref_lat = 31.9
ref_lon = -88.8
truelat1 = 21.9
truelat2 = 41.9
stand_lon = -88.8

[shared]
nz = 49
ztop = 20000.0
p_top = 10000.0
eta_levels = [
    1.0, 0.9978, 0.99519, 0.99212, 0.98849,
    0.98422, 0.97918, 0.97325, 0.96627, 0.95808,
    0.94846, 0.93719, 0.92402, 0.90866, 0.89079,
    0.87006, 0.84612, 0.81857, 0.78706, 0.75124,
    0.7108, 0.66556, 0.61547, 0.56067, 0.50519,
    0.45474, 0.40886, 0.36713, 0.32918, 0.29466,
    0.26328, 0.23473, 0.20877, 0.18516, 0.16369,
    0.14417, 0.12641, 0.11026, 0.09557, 0.08222,
    0.07007, 0.05902, 0.04898, 0.03984, 0.03153,
    0.02398, 0.0171, 0.01085, 0.00517, 0.0,
]
hybrid_opt = 2
etac = 0.2
base_temp = 290.0
time_step_sound = 4
emdiv = 0.01
hypsometric_opt = 2
h_sca_adv_order = 5
smdiv = 0.1
moist_adv_opt = 1
w_damping = 1
damp_opt = 3
zdamp = 5000.0
dampcoef = 0.2
khdif = 0.0
kvdif = 0.0
spec_zone = 1
relax_zone = 4
bldt = 0.0
nwp_diagnostics = 1
moist = true
moist_cq = true
mp_physics = 10
top_lid = false
epssm = 0.5
morr_rimed_ice = 1
wsm6_hail_opt = 0
ra_physics = 0
ra_lw_physics = 4
ra_sw_physics = 4
wrf_rrtmg_compatibility = "wrf-rrtmg-4-4-to-rte-rrtmgp-v2"
ra_rrtmg_variant = "rte-rrtmgp"
sf_sfclay_physics = 91
sf_surface_physics = 2
bl_pbl_physics = 1
num_soil_layers = 4
terrain_opt = 1
km_opt = 4
diff_6th_opt = 2
diff_6th_slopeopt = 1
map_proj = 1

[[domain]]
grid_id = 1
parent_id = 0
i_parent_start = 1
j_parent_start = 1
parent_grid_ratio = 1
parent_time_step_ratio = 1
nx = 300
ny = 250
time_step = 30
dx = 6000.0
specified = true
nested = false
history_interval_s = 900.0
radt = 12.0
cu_physics = 1
cudt_minutes = 5.0
diff_6th_factor = 0.12

# The moving child: 150x150 @ 2 km (300x300 km), initially over the
# central-Mississippi warm sector; the tracker walks it northeast with
# the storms.
[[domain]]
grid_id = 2
parent_id = 1
i_parent_start = 98
j_parent_start = 111
parent_grid_ratio = 3
parent_time_step_ratio = 3
nx = 150
ny = 150
specified = false
nested = true
history_interval_s = 900.0
epssm = 0.5
radt = 2.0
cu_physics = 0
diff_6th_factor = 0.1

# Leg-1 admissibility bounds: what may move and how far in one event.
[relocation]
enabled = true
grid_id = 2
max_move_parent_cells = 8
min_overlap_fraction = 0.5
# The 15-minute cadence this file's prose below already assumes.  It is
# not optional decoration: absent, cadence_seconds defaults to EVERY
# complete cycle (one 30 s root step), and the tracker's composite
# -reflectivity fallback then asks for refl_10cm at instants where it
# does not exist -- the microphysics stashes that plane at history
# cadence (gpuwm.core.refl), so the run refuses at the first cadence at
# which UH is under threshold.  900 s is both the documented policy and
# the history interval, so the fallback signal is there when consulted.
cadence_seconds = 900.0

# The tracker (gpuwm.core.storm_tracking).  Thresholds are d01-scale:
# UP_HELI_MAX on a 6 km parent -- 25 m2 s-2 marks a resolved mesocyclone
# there; 40 dBZ composite is the pre-rotation echo handoff.  At ~25 m/s
# storm motion a 15-min cadence is ~3.75 parent cells: the 2-cell
# dead-band kills chatter, 8 cells (48 km) bounds one event, and the
# 900 s cooldown holds moves to one per cadence.
[relocation.follow]
field = "uh"
threshold = 25.0
fallback_threshold = 40.0
search_margin_cells = 15
min_shift_cells = 2
max_shift_cells = 8
cooldown_seconds = 900.0

# Advisory data-acquisition hints (validated, not executed).
[fetch]
source = "era5"
cycle = "2011-04-26T12"
hours = 30
area = "17.87,-109.29,45.01,-68.31"
out = "data/moving_nest_demo_20110427"
cadence = 6

[case_data]
forcing = ["${GPUWM_DEMO_20110427_ROOT}/era5-combined.grib"]
vtable = "${GPUWM_DEMO_20110427_ROOT}/Vtable.ERA5_CDO"
forcing_interval_s = 21600.0
wps_namelist = "moving_nest_20110427_follow_2km.namelist.wps"
geog_root = "${GPUWM_CASE_DATA_ROOT}/WPS_GEOG"
sfcp_to_sfcp = true
output_domain = 1
output_title = "gpuwm moving-nest demo 2011-04-27 (follow arm)"
