# STORM-FOLLOWING MOVING NEST demo, arm C (spawn, then follow).
# 2011-04-27 outbreak, 06Z-18Z: d01 6 km over MS/AL/TN, and the SAME
# 150x150 @ 2 km child arm A carries -- except here it is DORMANT.  It is
# fully declared (so the memory plan prices it exactly as if it existed,
# and `gpuwm check` names what the declaration costs), but it integrates
# nothing until UP_HELI_MAX on the running parent crosses the trigger.
# At that moment it materializes at the trigger-chosen, keepout-clamped,
# whole-parent-cell placement -- inside the storm the trigger SAW, from
# the live parent rather than a stale analysis -- and from then on
# [relocation.follow] walks it northeast with the storms exactly as in
# arm A.  This is the birth event and the follow, end to end, in one run.
#
# The three arms, same case, same physics, same forcing:
#   A  moving_nest_20110427_follow_2km.toml   150x150 nest, moves
#   B  moving_nest_20110427_static_2km.toml   282x216 nest, fixed
#   C  moving_nest_20110427_spawn_2km.toml    150x150 nest, born then moves
#
# The reservation contract, stated plainly because it is easy to
# misread: a declared-but-never-triggered nest costs its reserved VRAM
# for the whole run and ZERO compute.  That is the contract, not a leak.
# Arm C therefore has the same VRAM envelope as arm A; what it buys is
# that no nest cells are integrated until there is a storm to integrate
# them around.
#
# Geometry/physics inherited from the proven tdnest 6-2 km ladder for this
# case (same projection, same d01, same profile); ERA5 forcing 2011-04-26/27
# six-hourly is already fetched (see tools/moving_nest_demo_20110427.ps1,
# which stages ${GPUWM_DEMO_20110427_ROOT}).
#
# restart_interval_s stays 0: a restart across a move promises nothing
# and a restart across a SPAWN inherits that posture
# whole -- so this arm does not checkpoint either.

[experiment]
name = "moving_nest_20110427_spawn_2km"
start_time = 2011-04-27T06:00:00
run_seconds = 43200.0
feedback = 0
smooth_option = 0
blend_width = 5
spec_bdy_width = 5
restart_interval_s = 0.0

[projection]
map_proj = "lambert"
ref_lat = 31.9
ref_lon = -88.8
truelat1 = 21.9
truelat2 = 41.9
stand_lon = -88.8

[shared]
nz = 49
ztop = 20000.0
p_top = 10000.0
eta_levels = [
    1.0, 0.9978, 0.99519, 0.99212, 0.98849,
    0.98422, 0.97918, 0.97325, 0.96627, 0.95808,
    0.94846, 0.93719, 0.92402, 0.90866, 0.89079,
    0.87006, 0.84612, 0.81857, 0.78706, 0.75124,
    0.7108, 0.66556, 0.61547, 0.56067, 0.50519,
    0.45474, 0.40886, 0.36713, 0.32918, 0.29466,
    0.26328, 0.23473, 0.20877, 0.18516, 0.16369,
    0.14417, 0.12641, 0.11026, 0.09557, 0.08222,
    0.07007, 0.05902, 0.04898, 0.03984, 0.03153,
    0.02398, 0.0171, 0.01085, 0.00517, 0.0,
]
hybrid_opt = 2
etac = 0.2
base_temp = 290.0
time_step_sound = 4
emdiv = 0.01
hypsometric_opt = 2
h_sca_adv_order = 5
smdiv = 0.1
moist_adv_opt = 1
w_damping = 1
damp_opt = 3
zdamp = 5000.0
dampcoef = 0.2
khdif = 0.0
kvdif = 0.0
spec_zone = 1
relax_zone = 4
bldt = 0.0
nwp_diagnostics = 1
moist = true
moist_cq = true
mp_physics = 10
top_lid = false
epssm = 0.5
morr_rimed_ice = 1
wsm6_hail_opt = 0
ra_physics = 0
ra_lw_physics = 4
ra_sw_physics = 4
wrf_rrtmg_compatibility = "wrf-rrtmg-4-4-to-rte-rrtmgp-v2"
ra_rrtmg_variant = "rte-rrtmgp"
sf_sfclay_physics = 91
sf_surface_physics = 2
bl_pbl_physics = 1
num_soil_layers = 4
terrain_opt = 1
km_opt = 4
diff_6th_opt = 2
diff_6th_slopeopt = 1
map_proj = 1

[[domain]]
grid_id = 1
parent_id = 0
i_parent_start = 1
j_parent_start = 1
parent_grid_ratio = 1
parent_time_step_ratio = 1
nx = 300
ny = 250
time_step = 30
dx = 6000.0
specified = true
nested = false
history_interval_s = 900.0
radt = 12.0
cu_physics = 1
cudt_minutes = 5.0
diff_6th_factor = 0.12

# The DORMANT child: the same 150x150 @ 2 km (300x300 km) nest arm A
# carries.  i_parent_start/j_parent_start here are a PLACEHOLDER, not a
# placement: they price the memory plan and give the config a readable
# home position, but the trigger chooses where the nest is actually born.
[[domain]]
grid_id = 2
parent_id = 1
i_parent_start = 98
j_parent_start = 111
parent_grid_ratio = 3
parent_time_step_ratio = 3
nx = 150
ny = 150
specified = false
nested = true
history_interval_s = 900.0
epssm = 0.5
radt = 2.0
cu_physics = 0
diff_6th_factor = 0.1
# The birth event.  UP_HELI_MAX on the 6 km parent: 25 m2 s-2 marks a
# resolved mesocyclone there (arm A tracks on that), so 40 is a
# deliberately HIGHER bar -- a move may be provisional, a birth should
# not be.  earliest_s = 3600 keeps the trigger out of the first hour of
# spin-up, where the parent's UH is a model artifact rather than a
# storm; latest_s = 36000 (16Z) closes the watch with two hours of run
# left, so a nest that is born still gets a life worth looking at.  If
# the window closes unfired the reservation was held for nothing --
# that is visible in the receipts and is the honest outcome, not a bug.
# search_box is the warm sector in 1-based inclusive parent cells; the
# placement is centred on the storm-core centroid inside it and then
# clamped so every side keeps spec_bdy_width + blend_width = 10 parent
# rows clear of the parent edge.
spawn = { trigger = "uh", threshold = 40.0, earliest_s = 3600.0, latest_s = 36000.0, search_box = [60, 60, 240, 190] }

# Leg-1 admissibility bounds: what may move and how far in one event.
# Identical to arm A -- once born, this nest is arm A's nest.
[relocation]
enabled = true
grid_id = 2
max_move_parent_cells = 8
min_overlap_fraction = 0.5
# See arm A: the 15-minute cadence is required, not decorative -- absent,
# the tracker is consulted every 30 s root step and its composite
# -reflectivity fallback asks for a refl_10cm plane the microphysics
# only stashes at history cadence.
cadence_seconds = 900.0

# The tracker (gpuwm.core.storm_tracking), identical to arm A: after the
# spawn this nest is an ordinary static nest that follows.
[relocation.follow]
field = "uh"
threshold = 25.0
fallback_threshold = 40.0
search_margin_cells = 15
min_shift_cells = 2
max_shift_cells = 8
cooldown_seconds = 900.0

# Advisory data-acquisition hints (validated, not executed).
[fetch]
source = "era5"
cycle = "2011-04-26T12"
hours = 30
area = "17.87,-109.29,45.01,-68.31"
out = "data/moving_nest_demo_20110427"
cadence = 6

[case_data]
forcing = ["${GPUWM_DEMO_20110427_ROOT}/era5-combined.grib"]
vtable = "${GPUWM_DEMO_20110427_ROOT}/Vtable.ERA5_CDO"
forcing_interval_s = 21600.0
wps_namelist = "moving_nest_20110427_spawn_2km.namelist.wps"
geog_root = "${GPUWM_CASE_DATA_ROOT}/WPS_GEOG"
sfcp_to_sfcp = true
output_domain = 1
output_title = "gpuwm moving-nest demo 2011-04-27 (spawn arm)"
